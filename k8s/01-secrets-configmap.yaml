apiVersion: v1
kind: ConfigMap
metadata:
  name: api-sentinel-config
  namespace: api-sentinel
data:
  NODE_ENV: "production"
  PORT: "5001"
  MONGODB_URI: "mongodb://mongodb.api-sentinel.svc.cluster.local:27017/api_sentinel"
  SECURITY_ENGINE_URL: "http://security-engine.api-sentinel.svc.cluster.local:8000"
  VULNERABLE_LAB_URL: "http://vulnerable-lab.api-sentinel.svc.cluster.local:5050"
  SSRF_STRICT: "true"
  ALLOWED_HOSTS: "localhost,127.0.0.1,host.docker.internal,vulnerable-lab,vulnerable-lab.api-sentinel.svc.cluster.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-sentinel-secrets
  namespace: api-sentinel
type: Opaque
stringData:
  JWT_SECRET: "api-sentinel-jwt-super-secret-key-production-strength-2026"
  ENCRYPTION_MASTER_KEY: "12345678901234567890123456789012"
