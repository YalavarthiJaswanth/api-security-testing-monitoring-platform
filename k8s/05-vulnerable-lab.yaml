apiVersion: v1
kind: Service
metadata:
  name: vulnerable-lab
  namespace: api-sentinel
spec:
  ports:
    - port: 5050
      targetPort: 5050
      name: http
  selector:
    app: vulnerable-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-lab
  namespace: api-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vulnerable-lab
  template:
    metadata:
      labels:
        app: vulnerable-lab
    spec:
      containers:
        - name: vulnerable-lab
          image: sentinel-vulnerable-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 5
