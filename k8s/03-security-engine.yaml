apiVersion: v1
kind: Service
metadata:
  name: security-engine
  namespace: api-sentinel
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: security-engine
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-engine
  namespace: api-sentinel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-engine
  template:
    metadata:
      labels:
        app: security-engine
    spec:
      containers:
        - name: security-engine
          image: sentinel-security-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
